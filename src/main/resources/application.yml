spring:
  application:
    name: concurrency-lab

  datasource:
    url: jdbc:postgresql://localhost:5432/concurrency_lab
    username: lab
    password: lab
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: localhost
      port: 6380
      # 장애 시 빠르게 실패시킨다 (Lettuce 기본 command timeout 은 60s → 요청이 1분 매달림)
      timeout: 2s
      connect-timeout: 2s

  jpa:
    hibernate:
      # 학습용: 애플리케이션을 띄울 때마다 스키마를 새로 만든다.
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

app:
  view-count:
    # Redis 에 쌓인 조회수 증가분을 DB 로 반영하는 주기
    flush-interval-ms: 2000

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
