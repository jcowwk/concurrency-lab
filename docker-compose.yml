services:
  postgres:
    image: postgres:16-alpine
    container_name: concurrency-lab-postgres
    environment:
      POSTGRES_DB: concurrency_lab
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Redis: 분산락(Redisson) / 원자적 연산(Lua) 단계에서 사용.
  # 호스트 포트는 6380 (다른 로컬 Redis 와 6379 충돌을 피하려고 옮김).
  redis:
    image: redis:7-alpine
    container_name: concurrency-lab-redis
    ports:
      - "6380:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
